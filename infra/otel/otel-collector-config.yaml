# OpenTelemetry Collector: apps send data here (OTLP), and this turns it into something Prometheus can read.
# Why not talk to Prometheus from every app? One middle box keeps labels and batching consistent and simpler to change later.

receivers:
  otlp:
    protocols:
      # gRPC is common for OpenTelemetry from Python (often a bit lighter than HTTP).
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  # Group small updates into batches so we don’t flood the metrics store on every single request.
  batch:
    timeout: 200ms
    send_batch_size: 512

exporters:
  # Prints trace summaries to the collector logs — handy when debugging on your laptop.
  debug:
    verbosity: basic
  prometheus:
    # Prometheus pulls metrics from this port (see infra/prometheus/prometheus.yml).
    endpoint: 0.0.0.0:8889
    const_labels:
      # Makes it clear in dashboards this is fake lab traffic, not real user data.
      arcs_environment: synthetic_testbed

extensions:
  health_check:
    endpoint: 0.0.0.0:13133

service:
  extensions: [health_check]
  pipelines:
    traces:
      receivers: [otlp]
      processors: [batch]
      exporters: [debug]
    metrics:
      receivers: [otlp]
      processors: [batch]
      exporters: [prometheus]

  telemetry:
    logs:
      level: warn
