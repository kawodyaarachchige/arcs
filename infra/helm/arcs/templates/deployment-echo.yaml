apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "arcs.fullname" . }}-echo
  labels:
    {{- include "arcs.echoLabels" . | nindent 4 }}
spec:
  replicas: {{ .Values.echo.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/name: arcs-echo-service
  template:
    metadata:
      labels:
        app.kubernetes.io/instance: {{ .Release.Name }}
        {{- include "arcs.echoLabels" . | nindent 8 }}
    spec:
      containers:
        - name: echo
          image: "{{ .Values.echo.image.repository }}:{{ .Values.echo.image.tag }}"
          imagePullPolicy: {{ .Values.echo.image.pullPolicy }}
          ports:
            - containerPort: 8080
              name: http
          env:
            - name: OTEL_SERVICE_NAME
              value: arcs-echo-service
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: "http://{{ include "arcs.fullname" . }}-otel-collector:4317"
            - name: MAX_REQUEST_DELAY_MS
              value: "500"
          readinessProbe:
            httpGet:
              path: /health/ready
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health/live
              port: http
            initialDelaySeconds: 10
            periodSeconds: 15
          resources:
            {{- toYaml .Values.echo.resources | nindent 12 }}
