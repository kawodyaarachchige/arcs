apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "arcs.fullname" . }}-aggregator
  labels:
    {{- include "arcs.aggregatorLabels" . | nindent 4 }}
spec:
  replicas: {{ .Values.aggregator.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/name: arcs-aggregator-service
  template:
    metadata:
      labels:
        app.kubernetes.io/instance: {{ .Release.Name }}
        {{- include "arcs.aggregatorLabels" . | nindent 8 }}
    spec:
      containers:
        - name: aggregator
          image: "{{ .Values.aggregator.image.repository }}:{{ .Values.aggregator.image.tag }}"
          imagePullPolicy: {{ .Values.aggregator.image.pullPolicy }}
          ports:
            - containerPort: 8080
              name: http
          env:
            - name: OTEL_SERVICE_NAME
              value: arcs-aggregator-service
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: "http://{{ include "arcs.fullname" . }}-otel-collector:4317"
            - name: DOWNSTREAM_URLS
              value: {{ include "arcs.aggregatorDownstreamUrls" . | quote }}
          readinessProbe:
            httpGet:
              path: /health/ready
              port: http
            initialDelaySeconds: 10
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health/live
              port: http
            initialDelaySeconds: 15
            periodSeconds: 15
          resources:
            {{- toYaml .Values.aggregator.resources | nindent 12 }}
