apiVersion: v1
kind: Service
metadata:
  name: {{ include "arcs.fullname" . }}-aggregator
  labels:
    {{- include "arcs.aggregatorLabels" . | nindent 4 }}
spec:
  type: ClusterIP
  ports:
    - port: 8080
      targetPort: http
      name: http
  selector:
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/name: arcs-aggregator-service
