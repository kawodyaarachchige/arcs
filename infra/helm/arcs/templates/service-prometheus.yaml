apiVersion: v1
kind: Service
metadata:
  name: {{ include "arcs.fullname" . }}-prometheus
  labels:
    {{- include "arcs.labels" . | nindent 4 }}
    app.kubernetes.io/component: prometheus
spec:
  type: ClusterIP
  ports:
    - port: 9090
      targetPort: http
      name: http
  selector:
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: prometheus
