# Processed with helm tpl — hostnames match Kubernetes Service names for this release.

static_resources:
  listeners:
    - name: listener_http
      address:
        socket_address: { address: 0.0.0.0, port_value: 10000 }
      filter_chains:
        - filters:
            - name: envoy.filters.network.http_connection_manager
              typed_config:
                "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
                stat_prefix: ingress_http
                codec_type: AUTO
                route_config:
                  name: local_route
                  virtual_hosts:
                    - name: backend
                      domains: ["*"]
                      routes:
                        - match: { prefix: "/" }
                          route: { cluster: echo_service }
                http_filters:
                  - name: envoy.filters.http.ext_authz
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.ext_authz.v3.ExtAuthz
                      transport_api_version: V3
                      http_service:
                        server_uri:
                          uri: http://{{ include "arcs.fullname" . }}-policy:8080/envoy/ext_authz
                          cluster: policy_service
                          timeout: 2s
                        authorization_request:
                          allowed_headers:
                            patterns:
                              - exact: x-arcs-route
                              - exact: x-arcs-error-rate
                              - exact: x-arcs-trace-id
                              - exact: x-arcs-obs
                              - exact: traceparent
                              - exact: x-request-id
                        authorization_response:
                          allowed_upstream_headers:
                            patterns:
                              - exact: x-arcs-retry
                              - exact: x-arcs-backoff-mult
                              - exact: x-arcs-timeout-ms
                              - exact: x-arcs-frozen
                              - exact: x-arcs-trace-id
                  - name: envoy.filters.http.router
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router

  clusters:
    - name: policy_service
      type: STRICT_DNS
      connect_timeout: 1s
      load_assignment:
        cluster_name: policy_service
        endpoints:
          - lb_endpoints:
              - endpoint:
                  address:
                    socket_address:
                      address: {{ include "arcs.fullname" . }}-policy
                      port_value: 8080

    - name: echo_service
      type: STRICT_DNS
      connect_timeout: 1s
      load_assignment:
        cluster_name: echo_service
        endpoints:
          - lb_endpoints:
              - endpoint:
                  address:
                    socket_address:
                      address: {{ include "arcs.fullname" . }}-echo
                      port_value: 8080

admin:
  address:
    socket_address: { address: 0.0.0.0, port_value: 9901 }
