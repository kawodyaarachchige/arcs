# Optional Kafka (KRaft, single broker, plaintext). For local labs only — use TLS/SASL for real deployments.
# From repo root: make compose-up-kafka
#
# Merges with infra/docker/docker-compose.yml and wires telemetry-bridge to consume arcs.telemetry.v1.

services:
  kafka:
    image: docker.io/bitnami/kafka:3.7.2-debian-12-r3
    ports:
      - "9092:9092"
    environment:
      ALLOW_PLAINTEXT_LISTENER: "yes"
      KAFKA_CFG_NODE_ID: "0"
      KAFKA_CFG_PROCESS_ROLES: controller,broker
      KAFKA_CFG_CONTROLLER_QUORUM_VOTERS: 0@kafka:9093
      KAFKA_CFG_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_CFG_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CFG_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CFG_AUTO_CREATE_TOPICS_ENABLE: "true"
    networks: [arcs]
    mem_limit: 1024m
    healthcheck:
      test: ["CMD-SHELL", "kafka-topics.sh --bootstrap-server localhost:9092 --list || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 8
      start_period: 45s

  telemetry-bridge:
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    depends_on:
      prometheus:
        condition: service_healthy
      kafka:
        condition: service_healthy
