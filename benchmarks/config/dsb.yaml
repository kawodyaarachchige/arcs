# k6 through Envoy while the upstream points at DeathStarBench nginx (see infra/envoy/envoy-dsb.yaml).
# Prerequisites: make compose-up-dsb, social graph initialized per benchmarks/dsb/README.md, stack healthy.

output_dir: benchmarks/runs

prometheus:
  base_url: "http://127.0.0.1:9090"

policy_configs:
  static: configs/benchmark-static.yaml
  adaptive: configs/benchmark-adaptive.yaml

load:
  # OpenResty serves static pages at / on port 10000 via Envoy → nginx-thrift.
  target_url: "http://127.0.0.1:10000/"
  executor: ramping-vus
  warmup_seconds: 10
  duration_seconds: 60
  stages:
    - duration: 20s
      target: 5
    - duration: 40s
      target: 15
  rate: 100
  time_unit: 1s
  pre_allocated_vus: 50
  max_vus: 100
  route_header: "/dsb"
  error_rate: 0.02
  observation:
    - 0.5
    - 0.5
    - 0.1
    - 0.3
    - 0.4
    - 0.05
    - 0.2
    - 1.0
    - 0.2
    - 0.1
    - 0.0
    - 0.0

prometheus_queries:
  - name: policy_decision_latency_p99_5m
    expr: 'arcs:policy:decision_latency_p99_5m'
  - name: policy_decisions_per_second
    expr: 'arcs:policy:decisions_per_second'
  - name: policy_overrides_per_second
    expr: 'arcs:policy:overrides_per_second'
  - name: http_p99_10m
    expr: 'arcs:http_server_duration:p99_10m'

post_load_settle_seconds: 15
